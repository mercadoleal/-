<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mercado Leal</title>
<meta name="description" content="Atendimento, ofertas e novidades do Mercado Leal.">
<meta name="theme-color" content="#171717">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;800&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#b4b396;--ink:#171717;--card:#171717;--cardink:#fff;--muted:rgba(23,23,23,.72);color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#171717;--ink:#fff;--card:#262626;--muted:rgba(255,255,255,.7);color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:Montserrat,"Segoe UI",Arial,sans-serif;overflow-x:hidden}
.wave{position:fixed;top:0;right:-80px;width:260px;height:100%;pointer-events:none;opacity:.12;color:var(--ink)}
main{position:relative;max-width:460px;margin:0 auto;padding:48px 22px 60px;display:flex;flex-direction:column;align-items:center;text-align:center}
.logo svg{width:104px;display:block;margin:0 auto 14px}
.nm{font-size:21px;font-weight:500;letter-spacing:.3em;text-indent:.3em}
.nm b{display:block;font-size:23px;font-weight:800;letter-spacing:.28em;margin-top:2px}
.tg{font-size:13px;line-height:1.6;color:var(--muted);margin:20px 0 30px;max-width:300px}
ul{list-style:none;margin:0;padding:0;width:100%;display:grid;gap:14px}
a.card{display:flex;align-items:center;gap:14px;padding:15px 18px;border-radius:22px;background:var(--card);color:var(--cardink);text-decoration:none;text-align:left;border:1px solid rgba(255,255,255,.1);box-shadow:0 14px 26px -14px rgba(0,0,0,.6);transition:transform .25s;opacity:0}
a.card:hover{transform:translateY(-3px)}
a.card:active{transform:scale(.98)}
a.card.s{animation:none;opacity:1}
.card.f{background:#b4b396;color:#171717;border-color:#b4b396;outline:3px solid #fff}
.ic{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#b4b396}
.ic svg{width:22px;height:22px;fill:none;stroke:#171717;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card.f .ic{background:#171717}
.card.f .ic svg{stroke:#b4b396}
.tx{flex:1;min-width:0}
.tx b{display:block;font-size:15px;font-weight:600}
.tx small{display:block;font-size:12px;opacity:.75;margin-top:3px;line-height:1.4}
.ar{flex:none;opacity:.6;transition:transform .25s}
.card:hover .ar{transform:translateX(4px)}
footer{margin-top:36px;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
main>*:not(ul){opacity:0}
.ready main>*:not(ul){animation:rise .8s .35s cubic-bezier(.2,.8,.2,1) forwards}
.ready a.card:not(.s){animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*100ms + .45s)}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
#intro{position:fixed;inset:0;z-index:100;background:#171717;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;transition:transform 1s cubic-bezier(.77,0,.18,1)}
#intro.out{transform:translateY(-100%)}
#intro .wv{position:absolute;top:0;right:-90px;width:300px;height:100%;transform:translateX(130%);animation:wv 1.8s .2s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes wv{to{transform:none}}
#intro .lg{width:150px;overflow:visible;position:relative;margin-bottom:18px}
.ring{stroke-dasharray:420;stroke-dashoffset:420;animation:dr 1.3s .3s ease forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.cart{opacity:0;transform-origin:70px 70px;transform:scale(.6);animation:pop .8s 1.1s cubic-bezier(.3,1.4,.5,1) forwards}
@keyframes pop{to{opacity:1;transform:none}}
.n1,.n2{position:relative;opacity:0;font-size:26px;text-indent:.3em}
.n1{font-weight:500;letter-spacing:.9em;animation:tx 1.2s 1.5s ease forwards}
.n2{font-weight:800;font-size:28px;letter-spacing:.28em;margin-top:4px;transform:translateY(12px);animation:rise .8s 2s forwards}
@keyframes tx{to{opacity:1;letter-spacing:.3em}}
.sheet{position:fixed;inset:0;z-index:150;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;justify-content:center}
.panel{background:#171717;color:#fff;width:100%;max-width:520px;max-height:90%;overflow:auto;border-radius:24px 24px 0 0;padding:22px 18px 26px;text-align:left}
.panel h2{margin:0 0 4px;font-size:16px}.panel p{margin:0 0 14px;font-size:12px;line-height:1.5;opacity:.7}
.panel .m{min-height:16px;opacity:1}.er{color:#ff8a80}.ok{color:#b4b396}
.row{display:grid;gap:8px;padding:14px;margin-bottom:12px;border-radius:16px;background:#232323}
.panel label{font-size:11px;opacity:.7}
.panel input:not([type=checkbox]),.panel select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid #444;background:#2c2c2c;color:#fff;font:13px Montserrat,sans-serif}
.bar,.chks{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.chk{display:flex;gap:6px;align-items:center;opacity:1!important}
.panel button{border:0;border-radius:10px;padding:10px 14px;background:#3a3a3a;color:#fff;font:600 12px Montserrat,sans-serif;cursor:pointer}
.panel button.pri{background:#b4b396;color:#171717}
.panel button:disabled{opacity:.5}
details{margin:0 0 12px;background:#232323;border-radius:16px;padding:12px 14px}
summary{font-size:12px;font-weight:600;cursor:pointer}
details input{margin:6px 0 4px}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;transition-duration:.01s!important}}
</style>
</head>
<body class="">
<svg class="wave" viewBox="0 0 260 1000" preserveAspectRatio="none" aria-hidden="true"><path d="M150 -10C60 220 200 430 170 640S110 900 150 1010" fill="none" stroke="currentColor" stroke-width="70"></path></svg>
<main>
  <header class="logo" id="logo"><svg viewBox="0 0 140 140"><circle cx="70" cy="70" r="66" fill="none" stroke="currentColor" stroke-width="3"></circle><g fill="currentColor" stroke="currentColor"><path d="M32 40h12l10 44h40" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"></path><path d="M48 52h56l-6 26H56z" stroke-width="2" stroke-linejoin="round"></path><circle cx="64" cy="100" r="5.5" stroke="none"></circle><circle cx="90" cy="100" r="5.5" stroke="none"></circle></g></svg><div class="nm">MERCADO<b>LEAL</b></div></header>
  <p class="tg">Atendimento, ofertas e novidades do Mercado Leal em um só lugar.</p>
  <ul id="list"></ul>
  <footer>Mercado Leal</footer>
</main>
<script type="application/json" id="data">{"h":"28374d60f87fcf87e1f5f0377e235242328826727bbf92824503de8dfebe97d5","links":[{"t":"Fale pelo WhatsApp","s":"Atendimento rápido, é só chamar","u":"https://wa.me/5528999882602?text=Ol%C3%A1%2C%20vim%20pelo%20Instagram.%20E%20gostaria%20de%20mais%20informa%C3%A7%C3%B5es!%20%F0%9F%9B%92","i":"whatsapp"},{"t":"Avalie no Google","s":"Sua opinião ajuda muito a gente","u":"https://share.google/yD5fnko38wcljTXTy","i":"star","f":true},{"t":"Grupo de ofertas","s":"Receba as promoções em primeira mão","u":"https://chat.whatsapp.com/IBFQ9CRDlm69C7zRPy5gwT","i":"tag"},{"t":"Siga no Instagram","s":"Novidades e ofertas da semana","u":"https://www.instagram.com/_mercadoleal?utm_source=ig_web_button_share_sheet&psln=ZDNlZDc0MzIxNw==","i":"instagram"}]}</script>
<script>
const ICONS={
whatsapp:'<path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"/><g transform="translate(7.2 7.2) scale(.4)" stroke-width="3.6"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></g>',
star:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/>',
tag:'<path d="M3 12V4h8l10 10-8 8z"/><path d="M7.5 8.5h.01"/>',
instagram:'<rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><path d="M17.5 6.5h.01"/>',
link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',
pin:'<path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>'};
const NAMES={whatsapp:'WhatsApp',tag:'Ofertas',star:'Avaliação Google',instagram:'Instagram',link:'Link',phone:'Telefone',pin:'Localização'};
const MARK='<circle class="ring" cx="70" cy="70" r="66" fill="none" stroke="currentColor" stroke-width="3"/><g class="cart" fill="currentColor" stroke="currentColor"><path d="M32 40h12l10 44h40" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M48 52h56l-6 26H56z" stroke-width="2" stroke-linejoin="round"/><circle cx="64" cy="100" r="5.5" stroke="none"/><circle cx="90" cy="100" r="5.5" stroke="none"/></g>';
const $=s=>document.querySelector(s);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const btn=(t,fn,c)=>{const x=el('button',c,t);x.type='button';x.onclick=fn;return x};
let S=JSON.parse($('#data').textContent),calm=false,panel;

$('#logo').innerHTML='<svg viewBox="0 0 140 140">'+MARK.replace('class="ring"','').replace('class="cart"','')+'</svg><div class="nm">MERCADO<b>LEAL</b></div>';

function render(){
  const ul=$('#list');ul.textContent='';
  S.links.filter(l=>l.on!==false).forEach((l,i)=>{
    const li=el('li'),a=el('a','card'+(l.f?' f':'')+(calm?' s':''));
    a.style.setProperty('--i',i);
    if(/^(https?:|tel:|mailto:)/i.test(l.u||'')){a.href=l.u;a.target='_blank';a.rel='noopener noreferrer'}
    a.innerHTML='<span class="ic"><svg viewBox="0 0 24 24">'+(ICONS[l.i]||ICONS.link)+'</svg></span><span class="tx"><b></b><small></small></span><svg class="ar" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
    a.querySelector('b').textContent=l.t||'';
    a.querySelector('small').textContent=l.s||'';
    li.append(a);ul.append(li);
  });
}
render();

const intro=el('div');intro.id='intro';intro.dataset.dyn='1';
intro.innerHTML='<svg class="wv" viewBox="0 0 260 1000" preserveAspectRatio="none"><path d="M150 -10C60 220 200 430 170 640S110 900 150 1010" fill="none" stroke="#787878" stroke-width="70"/></svg><svg class="lg" viewBox="0 0 140 140">'+MARK+'</svg><div class="n1">MERCADO</div><div class="n2">LEAL</div>';
document.body.append(intro);
const done=()=>{if(intro.classList.contains('out'))return;intro.classList.add('out');document.body.classList.add('ready');setTimeout(()=>intro.remove(),1100);setTimeout(()=>{calm=true;document.querySelectorAll('a.card').forEach(a=>a.classList.add('s'))},2200)};
intro.onclick=done;
setTimeout(done,matchMedia('(prefers-reduced-motion:reduce)').matches?300:3600);

/* Área restrita: abra o endereço do site terminando em #admin */
const sha256=async t=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const msg=(t,c)=>{const m=$('.panel .m');if(m){m.textContent=t;m.className='m '+(c||'')}};
function gate(){
  if($('.sheet'))return;
  const sh=el('div','sheet');sh.dataset.dyn='1';const p=el('div','panel');sh.append(p);document.body.append(sh);
  const i=el('input');i.type='password';i.placeholder='Senha';i.autocomplete='current-password';
  const go=btn('Entrar',async()=>{
    go.disabled=true;
    if(S.h&&await sha256(i.value)===S.h){panel=p;draw()}
    else{msg('Senha incorreta.','er');await new Promise(r=>setTimeout(r,1200));go.disabled=false}
  },'pri');
  i.onkeydown=e=>{if(e.key==='Enter')go.click()};
  const bar=el('div','bar');bar.append(go,btn('Cancelar',()=>{sh.remove();history.replaceState(null,'',location.pathname+location.search)}));
  p.append(el('h2',0,'Área restrita'),el('p',0,'Digite a senha para editar os links.'),i,el('p','m'),bar);
  i.focus();
}
function mv(i,d){const j=i+d;if(j<0||j>=S.links.length)return;[S.links[i],S.links[j]]=[S.links[j],S.links[i]];render();draw()}
let cfg={};try{cfg=JSON.parse(localStorage.getItem('ml-gh')||'{}')}catch(e){}
function draw(){
  panel.textContent='';
  panel.append(el('h2',0,'Editar links'),el('p',0,'Links sem endereço ficam ocultos para os visitantes.'));
  S.links.forEach((l,i)=>{
    const r=el('div','row');
    const inp=(k,lb,ph)=>{r.append(el('label',0,lb));const x=el('input');x.type='text';x.placeholder=ph||'';x.value=l[k]||'';x.oninput=()=>{l[k]=x.value;render()};r.append(x)};
    inp('t','Título');inp('s','Descrição');inp('u','Link','https://…');
    r.append(el('label',0,'Ícone'));
    const sel=el('select');Object.keys(NAMES).forEach(k=>{const o=el('option',0,NAMES[k]);o.value=k;sel.append(o)});
    sel.value=l.i||'link';sel.onchange=()=>{l.i=sel.value;render()};r.append(sel);
    const chk=(txt,get,set)=>{const w=el('label','chk'),c=el('input');c.type='checkbox';c.checked=get();c.onchange=()=>{set(c.checked);render()};w.append(c,txt);return w};
    const cs=el('div','chks');cs.append(chk('Destaque (verde)',()=>!!l.f,v=>l.f=v),chk('Visível',()=>l.on!==false,v=>l.on=v));
    const bar=el('div','bar');
    bar.append(btn('↑',()=>mv(i,-1)),btn('↓',()=>mv(i,1)),btn('Remover',()=>{S.links.splice(i,1);render();draw()}));
    r.append(cs,bar);panel.append(r);
  });
  panel.append(btn('+ Adicionar link',()=>{S.links.push({t:'Novo link',s:'',u:'',i:'link'});draw()}));
  const d=el('details');d.append(el('summary',0,'Senha e GitHub'));
  const f=(id,lb,v,ph,type)=>{d.append(el('label',0,lb));const x=el('input');x.id=id;x.type=type||'text';x.value=v||'';x.placeholder=ph||'';d.append(x)};
  f('np','Nova senha (deixe vazio para manter)','','Nova senha','password');
  f('rp','Repositório (usuario/repositorio)',cfg.repo,'meuusuario/mercado-leal');
  f('br','Branch',cfg.br||'main');
  f('pt','Arquivo',cfg.pt||'index.html');
  f('tk','Token do GitHub (fica só neste aparelho)',cfg.tk,'github_pat_…','password');
  panel.append(d,el('p','m'));
  const bar=el('div','bar'),pub=btn('Salvar no GitHub',()=>save(pub),'pri');
  bar.append(pub,btn('Baixar index.html',download),btn('Fechar',()=>location.reload()));
  panel.append(bar);
}
async function build(){
  const np=$('#np');if(np&&np.value)S.h=await sha256(np.value);
  const c=document.documentElement.cloneNode(true);
  c.querySelectorAll('[data-dyn]').forEach(n=>n.remove());
  c.querySelector('#list').textContent='';
  c.querySelector('body').className='';
  c.querySelector('#data').textContent=JSON.stringify(S).replace(/</g,'\\u003c');
  return '<!DOCTYPE html>\n'+c.outerHTML;
}
async function download(){
  const h=await build(),a=el('a');a.href=URL.createObjectURL(new Blob([h],{type:'text/html'}));a.download='index.html';a.click();
  msg('Arquivo baixado. Envie para o GitHub no lugar do index.html atual.','ok');
}
async function save(b){
  const repo=$('#rp').value.trim(),br=$('#br').value.trim()||'main',pt=$('#pt').value.trim()||'index.html',tk=$('#tk').value.trim();
  if(!/^[\w.-]+\/[\w.-]+$/.test(repo)||!tk){msg('Preencha o repositório e o token em "Senha e GitHub".','er');return}
  b.disabled=true;b.textContent='Salvando…';
  try{
    const html=await build(),api='https://api.github.com/repos/'+repo+'/contents/'+pt,H={Authorization:'Bearer '+tk,Accept:'application/vnd.github+json'};
    const g=await fetch(api+'?ref='+encodeURIComponent(br)+'&t='+Date.now(),{headers:H});
    if(g.status===401||g.status===403)throw new Error('Token sem permissão neste repositório.');
    if(!g.ok&&g.status!==404)throw new Error('Erro '+g.status+' ao ler o GitHub.');
    const sha=g.ok?(await g.json()).sha:undefined;
    const r=await fetch(api,{method:'PUT',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify({message:'Atualiza links do portal',content:btoa(unescape(encodeURIComponent(html))),branch:br,sha})});
    if(!r.ok)throw new Error('Erro '+r.status+'. O token precisa de permissão Contents: Read and write.');
    cfg={repo,br,pt,tk};try{localStorage.setItem('ml-gh',JSON.stringify(cfg))}catch(e){}
    msg('Salvo! O site atualiza em cerca de 1 minuto.','ok');
  }catch(e){msg(e.message,'er')}
  b.disabled=false;b.textContent='Salvar no GitHub';
}
if(location.hash==='#admin')gate();
addEventListener('hashchange',()=>{if(location.hash==='#admin')gate()});
</script>


</body></html>
